; Copiar a config.ini, que no se versiona: es lo único que cambia entre una máquina y el
; servidor publicado, y más adelante va a tener claves.

[app]
; «desarrollo» o «produccion». Decide cuánto detalle de un error ve el cliente (punto 6). Viene
; en «produccion» para que copiar el ejemplo tal cual no muestre el detalle: para trabajar en una
; máquina propia, cambiarlo a «desarrollo».
entorno = "produccion"
; La de las fechas y horas del log.
zona_horaria = "America/Argentina/Buenos_Aires"

[log]
; Relativo a backend/, que no se publica: el log no se puede pedir por URL.
archivo = "logs/app.log"
; De menor a mayor: debug, info, notice, warning, error, critical, alert, emergency.
; Se escribe ese nivel y los de arriba.
nivel = "debug"

[correo]
; A quién le llega el aviso de cada reserva (punto 5).
reservas = "reservas@pawprints.com.ar"
; De quién salen los correos del sitio. Con SMTP, casi todos los servidores exigen que sea la
; misma cuenta de smtp.usuario.
remitente = "no-responder@pawprints.com.ar"
nombre = "PAWPrints"
; «archivo» guarda cada correo como .eml en «carpeta» en lugar de mandarlo: es para desarrollo.
; «smtp» los manda de verdad con los datos de [smtp].
transporte = "archivo"
; Relativa a backend/, como el log.
carpeta = "logs/correos"

[smtp]
; Sólo se usa con transporte = "smtp". Para Gmail: smtp.gmail.com, 587, "tls", la dirección
; de la cuenta y una contraseña de aplicación (no la de la cuenta).
servidor = "smtp.gmail.com"
puerto = 587
; «tls» (STARTTLS, puerto 587), «ssl» (puerto 465) o «ninguna» (sólo un servidor de pruebas local).
seguridad = "tls"
usuario = ""
; Siempre entre comillas: sin ellas, una clave como «yes» o «0123» se lee como otro tipo de dato.
clave = ""
