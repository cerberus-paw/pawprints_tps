; Copiar a config.ini, que no se versiona: es lo único que cambia entre una máquina y el
; servidor publicado, y más adelante va a tener claves.

[app]
; «desarrollo» o «produccion». Decide cuánto detalle de un error ve el cliente (punto 6).
entorno = "desarrollo"
; La de las fechas y horas del log.
zona_horaria = "America/Argentina/Buenos_Aires"

[log]
; Relativo a backend/, que no se publica: el log no se puede pedir por URL.
archivo = "logs/app.log"
; De menor a mayor: debug, info, notice, warning, error, critical, alert, emergency.
; Se escribe ese nivel y los de arriba.
nivel = "debug"

[correo]
; A quién le llega el aviso de cada reserva (punto 5).
reservas = "reservas@pawprints.com.ar"
